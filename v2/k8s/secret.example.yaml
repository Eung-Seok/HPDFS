# Copy this file to secret.yaml and replace every placeholder locally.
# Do not commit secret.yaml. Kubernetes converts stringData to Secret data.

apiVersion: v1
kind: Secret
metadata:
  name: pdfs-secret
  namespace: pdfs
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql://pdfs:change-me@postgresql:5432/pdfs
